name: NaviTaxi Android Debug Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate local map styles
        run: |
          python -m json.tool app/src/main/assets/map_styles/osm_streets_experimental.json >/dev/null
          python -m json.tool app/src/main/assets/map_styles/offline_empty.json >/dev/null
          python -m json.tool app/src/main/assets/map_styles/pmtiles_synthetic.json >/dev/null
          python scripts/validate_pmtiles.py
      - name: Verify Android project and compile
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Scan built APK for embedded road and traffic sign evidence
        run: |
          python3 scripts/audit_road_assets.py --root . --apk app/build/outputs/apk/debug/app-debug.apk --out build/apk-road-audit.json
          python3 scripts/package_road_data.py --root . --apk app/build/outputs/apk/debug/app-debug.apk --output build/apk-road-assets.zip
      - name: Save verified APK road-asset inventory and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: phase4-apk-road-asset-audit
          path: |
            build/apk-road-audit.json
            build/apk-road-assets.zip
          if-no-files-found: error
      - name: Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
