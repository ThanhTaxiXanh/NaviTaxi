name: Phase 0 - Road Data Integrity
on:
  push:
    branches: ["phase-0/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free OSM PBF streaming reader (BSD-2-Clause)
        run: |
          python -m pip install --disable-pip-version-check osmium==4.3.2
          python -c "import osmium; print('pyosmium PBF reader available')"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: SQLite and provenance tests
        run: python -m unittest discover -s tests -v
      - name: Stream synthetic OSM test reference without trusting road data
        run: |
          PIN=$(sha256sum tests/fixtures/reference_only_synthetic.osm | cut -d ' ' -f1)
          python scripts/extract_osm_road_reference.py \
            --input tests/fixtures/reference_only_synthetic.osm \
            --expected-sha256 "$PIN" \
            --source-uri https://example.org/test-only/synthetic.osm \
            --output-dir build/osm-reference-fixture \
            --archive build/osm-reference-test-only.zip
      - name: Independently verify synthetic OSM reference JSONL hashes and safety fields
        run: |
          python scripts/audit_osm_reference_quality.py \
            --reference-dir build/osm-reference-fixture \
            --out build/osm-reference-quality-test.json
      - name: Build synthetic-only sign survey and legal speed review worklists
        run: |
          python scripts/build_road_review_queues.py \
            --reference-dir build/osm-reference-fixture \
            --output-dir build/road-review-test-only \
            --archive build/road-review-test-only.zip
      - name: Generate empty canonical SQLite for size and structure audit
        run: |
          python scripts/initialize_road_db.py --output build/road_intelligence.db
          python scripts/review_road_candidate.py --db build/road_intelligence.db --out build/road-candidate-audit.json
          python scripts/audit_road_assets.py --root . --out build/road-assets-report.json
          python scripts/package_road_data.py --root . --output build/road-intelligence-archive.zip
      - name: Archive test evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase0-road-data-evidence
          path: |
            build/road_intelligence.db
            build/road-candidate-audit.json
            build/road-assets-report.json
            build/road-intelligence-archive.zip
            build/osm-reference-fixture/
            build/osm-reference-test-only.zip
            build/osm-reference-quality-test.json
            build/road-review-test-only/
            build/road-review-test-only.zip
