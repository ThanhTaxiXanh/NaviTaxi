name: Phase 2 - Android MapLibre emulator smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/phase2-emulator-smoke.yml"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maplibre-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Allow emulator KVM acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run MapLibre screen instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Collect emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
